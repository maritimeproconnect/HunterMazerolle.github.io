<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7f9;--sf:#fff;--tx:#1b1f24;--mu:#667085;--bd:#dde1e7;--ac:#0f766e;--ac2:#e6f4f2;--ok:#15803d;--no:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--sf:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2c333d;--ac:#2dd4bf;--ac2:#12302d;--ok:#4ade80;--no:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--sf:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2c333d;--ac:#2dd4bf;--ac2:#12302d;--ok:#4ade80;--no:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:12px 4px;background:none;border:0;color:var(--mu);font:600 13px system-ui;cursor:pointer}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:18px;margin-top:22px}h3{font-size:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:11px 16px;font:600 15px system-ui;cursor:pointer}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:15px system-ui}
.fc{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:22px;white-space:pre-line}
.fc small{color:var(--mu);font-size:13px;margin-top:10px}.fc .bk{font-size:18px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.mu{color:var(--mu);font-size:14px}.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 10px;font-size:12px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;font:15px system-ui;cursor:pointer}
.opt.c{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.opt.x{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
.ex{background:var(--ac2);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;vertical-align:top}
.big{font-size:42px;font-weight:700;color:var(--ac)}
</style></head><body><div class="w" id="app"></div>

"}, {"q": "What does peri- mean?", "a": "Around", "e": "Pericardium surrounds the heart.", "k": "sa"}, {"q": "Define arthr/o.", "a": "Joint", "e": "As in arthritis.", "k": "sa"}, {"q": "Define nephr/o.", "a": "Kidney", "e": "As in nephrology.", "k": "sa"}, {"q": "What is the suffix meaning inflammation?", "a": "-itis", "e": "e.g., dermatitis.", "k": "sa"}, {"q": "What does -ectomy mean?", "a": "Surgical removal", "e": "e.g., appendectomy.", "k": "sa"}, {"q": "Expand Dx and Tx.", "a": "Diagnosis and treatment", "e": "Common medical abbreviations.", "k": "sa"}, {"q": "DTR means deep tendon reflex.", "a": "True", "e": "Common clinical abbreviation.", "k": "tf"}, {"q": "Which is the correct structural sequence?", "o": ["Cell → organ → tissue → organism", "Molecule → cell → tissue → organ → organ system → organism", "Tissue → cell → organ", "Organ → molecule → cell"], "a": 1, "e": "Increasing complexity.", "k": "mc"}, {"q": "Define superior and give one body example.", "a": "Toward head/above; e.g., chest superior to abdomen", "e": "Direction.", "k": "sa"}, {"q": "Define distal and give one example.", "a": "Farther from limb attachment; fingers distal to wrist", "e": "Direction.", "k": "sa"}, {"q": "The sternum is ____ to the spine.", "o": ["Posterior", "Distal", "Anterior", "Lateral"], "a": 2, "e": "Sternum lies toward the front.", "k": "mc"}, {"q": "What does supine mean?", "a": "Lying face up", "e": "Position.", "k": "sa"}, {"q": "Lying face down is:", "o": ["Supine", "Prone", "Midsagittal", "Proximal"], "a": 1, "e": "Position.", "k": "mc"}, {"q": "Which plane divides the body into equal left and right halves?", "a": "Midsagittal (median)", "e": "Plane.", "k": "sa"}, {"q": "The popliteal region is:", "o": ["Armpit", "Front of elbow", "Back of knee", "Groin"], "a": 2, "e": "Body region.", "k": "mc"}, {"q": "What is the inguinal region?", "a": "Groin", "e": "Body region.", "k": "sa"}, {"q": "Define homeostasis.", "a": "Maintenance of relatively stable internal conditions", "e": "Main physiology concept.", "k": "sa"}, {"q": "Give two examples of negative feedback.", "a": "Body temperature and blood glucose regulation", "e": "Counteracts deviations.", "k": "sa"}, {"q": "Give two examples of positive feedback.", "a": "Labour contractions and blood clotting", "e": "Amplifies a response.", "k": "sa"}, {"q": "Positive feedback returns a variable immediately to its set point.", "a": "False", "e": "That describes negative feedback more closely.", "k": "tf"}, {"q": "Moving a limb away from the midline is:", "o": ["Adduction", "Abduction", "Inversion", "Flexion"], "a": 1, "e": "A for away.", "k": "mc"}, {"q": "Turning the sole of your foot inward is:", "o": ["Eversion", "Pronation", "Inversion", "Elevation"], "a": 2, "e": "Inversion = inward.", "k": "mc"}, {"q": "What movement points the foot downward?", "a": "Plantar flexion", "e": "Point toes.", "k": "sa"}, {"q": "What is opposition?", "a": "Moving thumb across palm to touch a finger", "e": "Thumb movement.", "k": "sa"}, {"q": "What is retraction of the scapula?", "a": "Moving shoulder blades backward/together", "e": "Movement.", "k": "sa"}, {"q": "Name the two major layers of skin.", "a": "Epidermis and dermis", "e": "Skin.", "k": "sa"}, {"q": "How does a tendon differ from a ligament?", "a": "Tendon: muscle to bone; ligament: bone to bone", "e": "Connective tissues.", "k": "sa"}, {"q": "Define fascia.", "a": "Connective tissue surrounding and supporting body structures", "e": "Musculoskeletal system.", "k": "sa"}, {"q": "The axial skeleton includes:", "o": ["Hands and feet", "Limbs only", "Skull, vertebral column and rib cage", "Shoulder and pelvic girdles only"], "a": 2, "e": "Axial skeleton = central axis.", "k": "mc"}, {"q": "What is hypertrophy?", "a": "Increase in tissue size, often cell enlargement", "e": "Muscle changes.", "k": "sa"}, {"q": "What is myalgia?", "a": "Muscle pain", "e": "my- muscle, -algia pain.", "k": "sa"}, {"q": "What does cardi/o mean?", "a": "Heart", "e": "Cardiology.", "k": "sa"}, {"q": "What does lymph/o mean?", "a": "Lymph or lymphatic tissue", "e": "Lymphatic system.", "k": "sa"}, {"q": "Define arteries and veins using direction of flow.", "a": "Arteries carry blood away from heart; veins toward heart", "e": "Circulation.", "k": "sa"}, {"q": "What is the aorta?", "a": "Largest artery arising from left ventricle", "e": "Circulation.", "k": "sa"}, {"q": "What is ischaemia?", "a": "Insufficient blood flow to a tissue", "e": "Circulation.", "k": "sa"}, {"q": "An ECG records:", "o": ["Breathing volume", "Heart electrical activity", "Brain oxygen levels", "Blood glucose"], "a": 1, "e": "Electrocardiogram.", "k": "mc"}, {"q": "Translate cerebrovascular accident into everyday language.", "a": "Stroke", "e": "Lay language.", "k": "sa"}, {"q": "What does phag/o mean?", "a": "To eat / engulf", "e": "Phagocyte engulfs material.", "k": "sa"}, {"q": "What does crin/o mean?", "a": "To secrete", "e": "Endocrine.", "k": "sa"}, {"q": "What does gastr/o mean?", "a": "Stomach", "e": "Gastritis.", "k": "sa"}, {"q": "What does hepat/o mean?", "a": "Liver", "e": "Hepatitis.", "k": "sa"}, {"q": "Translate hypertension into everyday language.", "a": "High blood pressure", "e": "Lay language.", "k": "sa"}, {"q": "What does ren/o mean?", "a": "Kidney", "e": "Renal.", "k": "sa"}, {"q": "What does hyster/o mean?", "a": "Uterus", "e": "Hysterectomy.", "k": "sa"}, {"q": "What does mamm/o or mast/o mean?", "a": "Breast", "e": "Mammography; mastectomy.", "k": "sa"}, {"q": "Supination turns the forearm so the palm faces up in front of the body.", "a": "True", "e": "Movement.", "k": "tf"}, {"q": "What does subcutaneous mean?", "a": "Under the skin", "e": "Skin.", "k": "sa"}, {"q": "What is the eponym for the calcaneal tendon?", "a": "Achilles tendon", "e": "Eponym.", "k": "sa"}, {"q": "What does vasospasm mean?", "a": "Sudden narrowing from contraction of a blood vessel", "e": "System term.", "k": "sa"}, {"q": "Define hypertonic and hypotonic muscle tone.", "a": "Hypertonic: increased tone; hypotonic: decreased tone", "e": "Musculoskeletal.", "k": "sa"}],GUIDE="<p>How to study: Review one section, cover the definition, say the\nanswer out loud, then check yourself. Practise movement terms physically\nand use the final quiz to check recall.</p>\n<p><em>Source note: The workbook supplies the questions and term lists,\nnot their definitions. The definitions and examples here are completed\nstudy explanations. The assigned Tortora/Anatomy and Physiology textbook\nwas not supplied, so exact textbook phrasing and the requested textbook\npassage cannot be verified.</em></p>\n<h1 id=\"building-medical-words\">1. Building medical words</h1>\n<p>Prefix: Beginning of word; changes meaning (hyper- = high).</p>\n<p>Root: Core meaning (cardi = heart).</p>\n<p>Suffix: Ending identifying condition or procedure (-itis =\ninflammation).</p>\n<p>Combining vowel: Usually o, linking word parts; cardi/o/logy;\nnormally dropped before a vowel-starting suffix.</p>\n<p>Plural forms: Common patterns include vertebra → vertebrae; diagnosis\n→ diagnoses; bacterium → bacteria.</p>\n<p>Eponym: A term named after a person or figure: Achilles tendon.</p>\n<h2 id=\"common-prefixes\">Common prefixes</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>a-</td>\n<td>without / absence of. Example: apnoea (no breathing).</td>\n</tr>\n<tr class=\"even\">\n<td>an-</td>\n<td>without / absence of. Example: anaesthesia (loss of sensation).</td>\n</tr>\n<tr class=\"odd\">\n<td>ab-</td>\n<td>away from. Example: abduction (away from midline).</td>\n</tr>\n<tr class=\"even\">\n<td>ad-</td>\n<td>toward. Example: adduction (toward midline).</td>\n</tr>\n<tr class=\"odd\">\n<td>anti-</td>\n<td>against. Example: antibiotic (against bacteria).</td>\n</tr>\n<tr class=\"even\">\n<td>bi-</td>\n<td>two. Example: bilateral (both sides).</td>\n</tr>\n<tr class=\"odd\">\n<td>contra-</td>\n<td>against / opposite. Example: contralateral (opposite side).</td>\n</tr>\n<tr class=\"even\">\n<td>dys-</td>\n<td>difficult, abnormal or painful. Example: dysphagia (difficulty\nswallowing).</td>\n</tr>\n<tr class=\"odd\">\n<td>endo-</td>\n<td>within. Example: endocardium (inner heart layer).</td>\n</tr>\n<tr class=\"even\">\n<td>epi-</td>\n<td>upon / above. Example: epidermis (outer skin layer).</td>\n</tr>\n<tr class=\"odd\">\n<td>homeo-</td>\n<td>same / steady. Example: homeostasis (stable internal\nconditions).</td>\n</tr>\n<tr class=\"even\">\n<td>hyper-</td>\n<td>high / excessive. Example: hypertension (high blood pressure).</td>\n</tr>\n<tr class=\"odd\">\n<td>hypo-</td>\n<td>low / below normal. Example: hypotension (low blood pressure).</td>\n</tr>\n<tr class=\"even\">\n<td>infra-</td>\n<td>below. Example: infraspinatus (below scapular spine).</td>\n</tr>\n<tr class=\"odd\">\n<td>ipsi-</td>\n<td>same side. Example: ipsilateral (same side of body).</td>\n</tr>\n<tr class=\"even\">\n<td>para-</td>\n<td>beside / abnormal. Example: paravertebral (beside vertebrae).</td>\n</tr>\n<tr class=\"odd\">\n<td>peri-</td>\n<td>around. Example: pericardium (around the heart).</td>\n</tr>\n<tr class=\"even\">\n<td>supra-</td>\n<td>above. Example: supraspinatus (above scapular spine).</td>\n</tr>\n<tr class=\"odd\">\n<td>tachy-</td>\n<td>fast. Example: tachycardia (fast heart rate).</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"common-combining-forms\">Common combining forms</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Aden/o-</td>\n<td>gland. Example: adenitis (gland inflammation).</td>\n</tr>\n<tr class=\"even\">\n<td>Angio/o-</td>\n<td>vessel, usually blood or lymph. Example: angiography (vessel\nimaging).</td>\n</tr>\n<tr class=\"odd\">\n<td>Arthro/o-</td>\n<td>joint. Example: arthritis (joint inflammation).</td>\n</tr>\n<tr class=\"even\">\n<td>Brachi/o-</td>\n<td>arm. Example: brachial (relating to the arm).</td>\n</tr>\n<tr class=\"odd\">\n<td>Bronch/o-</td>\n<td>bronchus / airway. Example: bronchitis (inflamed bronchi).</td>\n</tr>\n<tr class=\"even\">\n<td>Cardi/o-</td>\n<td>heart. Example: cardiology (study of the heart).</td>\n</tr>\n<tr class=\"odd\">\n<td>Cephal/o-</td>\n<td>head. Example: cephalic (relating to the head).</td>\n</tr>\n<tr class=\"even\">\n<td>Chondr/o-</td>\n<td>cartilage. Example: chondromalacia (cartilage softening).</td>\n</tr>\n<tr class=\"odd\">\n<td>Cut/o or Cutane/o-</td>\n<td>skin. Example: cutaneous (relating to skin).</td>\n</tr>\n<tr class=\"even\">\n<td>Cyt/o-</td>\n<td>cell. Example: cytology (study of cells).</td>\n</tr>\n<tr class=\"odd\">\n<td>Dermat/o-</td>\n<td>skin. Example: dermatitis (skin inflammation).</td>\n</tr>\n<tr class=\"even\">\n<td>Enter/o-</td>\n<td>intestine, usually small intestine. Example: enteritis (intestinal\ninflammation).</td>\n</tr>\n<tr class=\"odd\">\n<td>Erythr/o-</td>\n<td>red. Example: erythrocyte (red blood cell).</td>\n</tr>\n<tr class=\"even\">\n<td>Gastro/o-</td>\n<td>stomach. Example: gastritis (stomach inflammation).</td>\n</tr>\n<tr class=\"odd\">\n<td>Hepat/o-</td>\n<td>liver. Example: hepatitis (liver inflammation).</td>\n</tr>\n<tr class=\"even\">\n<td>Lumb/o-</td>\n<td>lower back / loin. Example: lumbosacral (lower back and\nsacrum).</td>\n</tr>\n<tr class=\"odd\">\n<td>My/o-</td>\n<td>muscle. Example: myalgia (muscle pain).</td>\n</tr>\n<tr class=\"even\">\n<td>Myel/o-</td>\n<td>spinal cord or bone marrow. Example: myelopathy (spinal cord\ndisorder).</td>\n</tr>\n<tr class=\"odd\">\n<td>Nephr/o-</td>\n<td>kidney. Example: nephrology (study of kidneys).</td>\n</tr>\n<tr class=\"even\">\n<td>Neur/o-</td>\n<td>nerve / nervous system. Example: neurology (study of the nervous\nsystem).</td>\n</tr>\n<tr class=\"odd\">\n<td>Or/o-</td>\n<td>mouth. Example: oral (relating to the mouth).</td>\n</tr>\n<tr class=\"even\">\n<td>Osteo/o-</td>\n<td>bone (standard combining form: oste/o). Example: osteoporosis (loss\nof bone density).</td>\n</tr>\n<tr class=\"odd\">\n<td>Patho/o-</td>\n<td>disease. Example: pathology (study of disease).</td>\n</tr>\n<tr class=\"even\">\n<td>Pneum/o-</td>\n<td>air or lung. Example: pneumonia (lung infection /\ninflammation).</td>\n</tr>\n<tr class=\"odd\">\n<td>Thromb/o-</td>\n<td>blood clot. Example: thrombosis (clot formation).</td>\n</tr>\n<tr class=\"even\">\n<td>Py/o-</td>\n<td>pus. Example: pyoderma (pus-forming skin condition).</td>\n</tr>\n<tr class=\"odd\">\n<td>Therm/o-</td>\n<td>heat / temperature. Example: thermoregulation (temperature\ncontrol).</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"common-suffixes\">Common suffixes</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>-algia</td>\n<td>pain. Example: myalgia (muscle pain).</td>\n</tr>\n<tr class=\"even\">\n<td>-ectomy</td>\n<td>surgical removal. Example: appendectomy (appendix removal).</td>\n</tr>\n<tr class=\"odd\">\n<td>-emia</td>\n<td>condition of the blood. Example: glycaemia (blood sugar level).</td>\n</tr>\n<tr class=\"even\">\n<td>-itis</td>\n<td>inflammation. Example: tendinitis (tendon inflammation).</td>\n</tr>\n<tr class=\"odd\">\n<td>-malacia</td>\n<td>abnormal softening. Example: chondromalacia (cartilage\nsoftening).</td>\n</tr>\n<tr class=\"even\">\n<td>-megaly</td>\n<td>enlargement. Example: cardiomegaly (enlarged heart).</td>\n</tr>\n<tr class=\"odd\">\n<td>-oma</td>\n<td>tumour / mass / swelling. Example: lipoma (fatty tumour).</td>\n</tr>\n<tr class=\"even\">\n<td>-osis</td>\n<td>condition, often abnormal. Example: scoliosis (spinal\ncurvature).</td>\n</tr>\n<tr class=\"odd\">\n<td>-plasia</td>\n<td>formation / development. Example: hyperplasia (increased cell\nnumber).</td>\n</tr>\n<tr class=\"even\">\n<td>-poiesis</td>\n<td>formation / production. Example: haematopoiesis (blood-cell\nformation).</td>\n</tr>\n<tr class=\"odd\">\n<td>-metric</td>\n<td>relating to measurement. Example: spirometric (relating to breathing\nmeasurement).</td>\n</tr>\n<tr class=\"even\">\n<td>-plasty</td>\n<td>surgical repair / reshaping. Example: rhinoplasty (nose\nsurgery).</td>\n</tr>\n<tr class=\"odd\">\n<td>-tomy</td>\n<td>incision / cutting into. Example: tracheotomy (incision into\ntrachea).</td>\n</tr>\n<tr class=\"even\">\n<td>-ism</td>\n<td>state / process / condition. Example: hypothyroidism (low thyroid\nactivity).</td>\n</tr>\n<tr class=\"odd\">\n<td>-logy</td>\n<td>study of. Example: neurology (study of nervous system).</td>\n</tr>\n<tr class=\"even\">\n<td>-graphy</td>\n<td>process of recording / imaging. Example: radiography (X-ray\nimaging).</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"medical-abbreviations\">Medical abbreviations</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Px</td>\n<td>Prognosis (varies by context)</td>\n</tr>\n<tr class=\"even\">\n<td>Hx</td>\n<td>History</td>\n</tr>\n<tr class=\"odd\">\n<td>Dx</td>\n<td>Diagnosis</td>\n</tr>\n<tr class=\"even\">\n<td>Tx</td>\n<td>Treatment</td>\n</tr>\n<tr class=\"odd\">\n<td>BP</td>\n<td>Blood pressure</td>\n</tr>\n<tr class=\"even\">\n<td>DTR</td>\n<td>Deep tendon reflex</td>\n</tr>\n</tbody>\n</table></div>\n<p>Structural levels: molecule → cell → tissue → organ → organ system →\norganism.</p>\n<h1 id=\"directions-positions-and-regions\">2. Directions, positions and\nregions</h1>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Superior/cranial or cephalad</td>\n<td>toward the head / above The chest is superior to the abdomen.</td>\n</tr>\n<tr class=\"even\">\n<td>Inferior/caudal</td>\n<td>toward the feet / below The knee is inferior to the hip.</td>\n</tr>\n<tr class=\"odd\">\n<td>Proximal</td>\n<td>closer to the trunk or point of attachment The elbow is proximal to\nthe wrist.</td>\n</tr>\n<tr class=\"even\">\n<td>Distal</td>\n<td>farther from the trunk or point of attachment The fingers are distal\nto the wrist.</td>\n</tr>\n<tr class=\"odd\">\n<td>Lateral</td>\n<td>away from the body’s midline The ears are lateral to the nose.</td>\n</tr>\n<tr class=\"even\">\n<td>Medial</td>\n<td>toward the body’s midline The nose is medial to the eyes.</td>\n</tr>\n<tr class=\"odd\">\n<td>Anterior</td>\n<td>toward the front of the body The sternum is anterior to the\nspine.</td>\n</tr>\n<tr class=\"even\">\n<td>Posterior</td>\n<td>toward the back of the body The spine is posterior to the\nsternum.</td>\n</tr>\n<tr class=\"odd\">\n<td>Recumbent</td>\n<td>lying down, in any position The client was recumbent on the\ntreatment table.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Anatomical</td>\n<td>Upright; eyes and toes forward; palms forward.</td>\n</tr>\n<tr class=\"even\">\n<td>Prone</td>\n<td>Face down</td>\n</tr>\n<tr class=\"odd\">\n<td>Supine</td>\n<td>Face up</td>\n</tr>\n<tr class=\"even\">\n<td>Lateral recumbent</td>\n<td>Lying on side</td>\n</tr>\n<tr class=\"odd\">\n<td>Midsagittal</td>\n<td>Equal left and right halves</td>\n</tr>\n<tr class=\"even\">\n<td>Coronal/frontal</td>\n<td>Front and back sections</td>\n</tr>\n<tr class=\"odd\">\n<td>Transverse</td>\n<td>Upper and lower sections</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"body-regions\">Body regions</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cephal/o -</td>\n<td>head; e.g., cephalic region</td>\n</tr>\n<tr class=\"even\">\n<td>Coronal -</td>\n<td>crown of the head; coronal (frontal) plane divides front from back;\ne.g., coronal suture</td>\n</tr>\n<tr class=\"odd\">\n<td>Cervic/o -</td>\n<td>neck (sometimes cervix in other contexts); e.g., cervical spine</td>\n</tr>\n<tr class=\"even\">\n<td>Axillary -</td>\n<td>armpit; e.g., axillary region</td>\n</tr>\n<tr class=\"odd\">\n<td>Cubital -</td>\n<td>elbow; e.g., cubital region</td>\n</tr>\n<tr class=\"even\">\n<td>Antecubital -</td>\n<td>front of elbow; e.g., antecubital fossa</td>\n</tr>\n<tr class=\"odd\">\n<td>Thorac/o -</td>\n<td>chest; e.g., thoracic region</td>\n</tr>\n<tr class=\"even\">\n<td>Abdominal -</td>\n<td>abdomen; e.g., abdominal wall</td>\n</tr>\n<tr class=\"odd\">\n<td>Pelvic -</td>\n<td>pelvis; e.g., pelvic girdle</td>\n</tr>\n<tr class=\"even\">\n<td>Lumb/o -</td>\n<td>lower back; e.g., lumbar region</td>\n</tr>\n<tr class=\"odd\">\n<td>Inguinal -</td>\n<td>groin; e.g., inguinal ligament</td>\n</tr>\n<tr class=\"even\">\n<td>Popliteal -</td>\n<td>back of knee; e.g., popliteal fossa</td>\n</tr>\n</tbody>\n</table></div>\n<h1 id=\"homeostasis-and-feedback\">3. Homeostasis and feedback</h1>\n<p>Homeostasis: maintaining relatively stable internal body\nconditions.</p>\n<p>Negative feedback: reverses a change (examples: temperature control\nand regulation of blood glucose).</p>\n<p>Positive feedback: increases a response until an event is finished\n(examples: childbirth contractions and clot formation).</p>\n<h1 id=\"movement-terminology\">4. Movement terminology</h1>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Flexion</td>\n<td>bending a joint, usually decreasing the angle; e.g., bend elbow</td>\n</tr>\n<tr class=\"even\">\n<td>Extension</td>\n<td>straightening a joint, usually increasing the angle; e.g.,\nstraighten elbow</td>\n</tr>\n<tr class=\"odd\">\n<td>Abduction</td>\n<td>moving away from the body’s midline; e.g., lift arm out to side</td>\n</tr>\n<tr class=\"even\">\n<td>Adduction</td>\n<td>moving toward the body’s midline; e.g., lower arm back to side</td>\n</tr>\n<tr class=\"odd\">\n<td>Pronation</td>\n<td>turning forearm so palm faces down/posteriorly in anatomical\nposition; e.g., turn palm down</td>\n</tr>\n<tr class=\"even\">\n<td>Supination</td>\n<td>turning forearm so palm faces up/anteriorly in anatomical position;\ne.g., turn palm up</td>\n</tr>\n<tr class=\"odd\">\n<td>Eversion</td>\n<td>turning sole of foot outward; e.g., tilt sole laterally</td>\n</tr>\n<tr class=\"even\">\n<td>Inversion</td>\n<td>turning sole of foot inward; e.g., tilt sole medially</td>\n</tr>\n<tr class=\"odd\">\n<td>Plantar flexion</td>\n<td>pointing foot / toes downward at ankle; e.g., press gas pedal</td>\n</tr>\n<tr class=\"even\">\n<td>Dorsi flexion</td>\n<td>lifting top of foot toward shin at ankle (dorsiflexion); e.g., lift\ntoes up</td>\n</tr>\n<tr class=\"odd\">\n<td>Circumduction</td>\n<td>moving limb in circular cone-shaped path; e.g., make arm\ncircles</td>\n</tr>\n<tr class=\"even\">\n<td>Protraction</td>\n<td>moving body part forward; e.g., push shoulder blades forward</td>\n</tr>\n<tr class=\"odd\">\n<td>Retraction</td>\n<td>moving body part backward; e.g., squeeze shoulder blades\ntogether</td>\n</tr>\n<tr class=\"even\">\n<td>Elevation</td>\n<td>moving a part superiorly; e.g., shrug shoulders</td>\n</tr>\n<tr class=\"odd\">\n<td>Depression</td>\n<td>moving a part inferiorly; e.g., lower shoulders after shrug</td>\n</tr>\n<tr class=\"even\">\n<td>Opposition</td>\n<td>bringing thumb across palm toward fingertip; e.g., touch thumb to\nlittle finger</td>\n</tr>\n</tbody>\n</table></div>\n<p>Practical review: demonstrate each movement with a partner. A written\ndefinition alone does not complete the hands-on activity.</p>\n<h1 id=\"skin-and-musculoskeletal-systems\">5. Skin and musculoskeletal\nsystems</h1>\n<h2 id=\"skin-terms\">Skin terms</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Epithelium</td>\n<td>tissue that covers body surfaces and lines cavities and glands</td>\n</tr>\n<tr class=\"even\">\n<td>Epidermis</td>\n<td>outer, protective layer of skin</td>\n</tr>\n<tr class=\"odd\">\n<td>Dermis</td>\n<td>skin layer beneath epidermis with blood vessels, nerves and\nconnective tissue</td>\n</tr>\n<tr class=\"even\">\n<td>Subcutaneous / sub-dermal</td>\n<td>under the skin; subcutaneous tissue includes connective and fatty\ntissue</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"musculoskeletal-combining-forms\">Musculoskeletal combining\nforms</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Arthr/o -</td>\n<td>joint; e.g., arthritis</td>\n</tr>\n<tr class=\"even\">\n<td>Cervic/o -</td>\n<td>neck or cervix; neck in this context; e.g., cervical spine</td>\n</tr>\n<tr class=\"odd\">\n<td>Lumb/o -</td>\n<td>lower back; e.g., lumbar pain</td>\n</tr>\n<tr class=\"even\">\n<td>My/o -</td>\n<td>muscle; e.g., myalgia</td>\n</tr>\n<tr class=\"odd\">\n<td>Oste/o -</td>\n<td>bone; e.g., osteocyte</td>\n</tr>\n<tr class=\"even\">\n<td>Rhin/o -</td>\n<td>nose; e.g., rhinitis</td>\n</tr>\n<tr class=\"odd\">\n<td>Thorac/o -</td>\n<td>chest; e.g., thoracic</td>\n</tr>\n<tr class=\"even\">\n<td>Cox/o -</td>\n<td>hip; e.g., coxalgia (hip pain)</td>\n</tr>\n<tr class=\"odd\">\n<td>Calcane/o-</td>\n<td>heel / calcaneus; e.g., calcaneal tendon</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"musculoskeletal-terms\">Musculoskeletal terms</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Appendicular skeleton</td>\n<td>bones of the limbs plus shoulder and pelvic girdles</td>\n</tr>\n<tr class=\"even\">\n<td>Axial skeleton</td>\n<td>skull, vertebral column, ribs and sternum</td>\n</tr>\n<tr class=\"odd\">\n<td>Ligament</td>\n<td>strong connective tissue joining bone to bone at a joint</td>\n</tr>\n<tr class=\"even\">\n<td>Tendon</td>\n<td>connective tissue attaching muscle to bone</td>\n</tr>\n<tr class=\"odd\">\n<td>Fascia</td>\n<td>connective-tissue sheets and networks surrounding/supporting muscles\nand other structures</td>\n</tr>\n<tr class=\"even\">\n<td>Hypertrophy</td>\n<td>increase in tissue or muscle size, usually from cell\nenlargement</td>\n</tr>\n<tr class=\"odd\">\n<td>Hypertonic</td>\n<td>abnormally increased muscle tone / tension in clinical use</td>\n</tr>\n<tr class=\"even\">\n<td>Hypotonic</td>\n<td>abnormally decreased muscle tone in clinical use</td>\n</tr>\n<tr class=\"odd\">\n<td>Myalgia</td>\n<td>muscle pain</td>\n</tr>\n<tr class=\"even\">\n<td>Vertebrae</td>\n<td>plural of vertebra; bones forming spinal column</td>\n</tr>\n<tr class=\"odd\">\n<td>Prosthesis</td>\n<td>artificial replacement for a missing body part</td>\n</tr>\n</tbody>\n</table></div>\n<h1 id=\"circulatory-lymphatic-respiratory-and-nervous-systems\">6.\nCirculatory, lymphatic, respiratory and nervous systems</h1>\n<h2 id=\"combining-forms\">Combining forms</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cardi/o -</td>\n<td>heart; e.g., cardiology</td>\n</tr>\n<tr class=\"even\">\n<td>Hem/o -</td>\n<td>blood; e.g., haemolysis</td>\n</tr>\n<tr class=\"odd\">\n<td>Hemat/o -</td>\n<td>blood; e.g., haematology</td>\n</tr>\n<tr class=\"even\">\n<td>Immun/o -</td>\n<td>immune system / protection; e.g., immunology</td>\n</tr>\n<tr class=\"odd\">\n<td>Lymph/o -</td>\n<td>lymph / lymphatic tissue; e.g., lymphocyte</td>\n</tr>\n<tr class=\"even\">\n<td>Phag/o -</td>\n<td>eating / engulfing; e.g., phagocyte</td>\n</tr>\n<tr class=\"odd\">\n<td>Nas/o -</td>\n<td>nose; e.g., nasal</td>\n</tr>\n<tr class=\"even\">\n<td>Or/o -</td>\n<td>mouth; e.g., oral</td>\n</tr>\n<tr class=\"odd\">\n<td>Pulmon/o -</td>\n<td>lung; e.g., pulmonary</td>\n</tr>\n<tr class=\"even\">\n<td>Rhin/o -</td>\n<td>nose; e.g., rhinitis</td>\n</tr>\n<tr class=\"odd\">\n<td>Vascul/o -</td>\n<td>blood vessel; e.g., vascular</td>\n</tr>\n<tr class=\"even\">\n<td>Vas/o -</td>\n<td>vessel / duct; e.g., vasodilation</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"common-terms\">Common terms</h2>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Anemia</td>\n<td>anaemia: decreased red blood cells or haemoglobin, reducing\noxygen-carrying capacity</td>\n</tr>\n<tr class=\"even\">\n<td>Autonomic</td>\n<td>regulating automatic functions such as digestion and heart rate\n(autonomic nervous system)</td>\n</tr>\n<tr class=\"odd\">\n<td>Arteries</td>\n<td>blood vessels carrying blood away from the heart</td>\n</tr>\n<tr class=\"even\">\n<td>Aorta</td>\n<td>largest artery, carrying blood from the left ventricle to the\nbody</td>\n</tr>\n<tr class=\"odd\">\n<td>Arteriosclerosis</td>\n<td>thickening and stiffening of artery walls</td>\n</tr>\n<tr class=\"even\">\n<td>Capillaries</td>\n<td>tiny vessels where gases, nutrients and wastes are exchanged with\ntissues</td>\n</tr>\n<tr class=\"odd\">\n<td>Cerebrovascular Accident</td>\n<td>stroke: loss of brain function from blocked blood flow or\nbleeding</td>\n</tr>\n<tr class=\"even\">\n<td>Electrocardiogram (ECG)</td>\n<td>recording of the heart’s electrical activity</td>\n</tr>\n<tr class=\"odd\">\n<td>Hypertension</td>\n<td>high blood pressure</td>\n</tr>\n<tr class=\"even\">\n<td>Hypoglycemia</td>\n<td>low blood glucose (blood sugar)</td>\n</tr>\n<tr class=\"odd\">\n<td>Ischemia</td>\n<td>inadequate blood supply to tissue, reducing oxygen delivery</td>\n</tr>\n<tr class=\"even\">\n<td>Paralysis</td>\n<td>loss of voluntary muscle movement</td>\n</tr>\n<tr class=\"odd\">\n<td>Pericarditis</td>\n<td>inflammation of the sac around the heart</td>\n</tr>\n<tr class=\"even\">\n<td>Vasospasm</td>\n<td>sudden contraction/narrowing of a blood vessel</td>\n</tr>\n<tr class=\"odd\">\n<td>Veins</td>\n<td>blood vessels carrying blood toward the heart</td>\n</tr>\n</tbody>\n</table></div>\n<h1 id=\"endocrine-and-gastrointestinal-systems\">7. Endocrine and\ngastrointestinal systems</h1>\n<h2 id=\"combining-forms-1\">Combining forms</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Aden/o –</td>\n<td>gland; e.g., adenoma</td>\n</tr>\n<tr class=\"even\">\n<td>Crin/o -</td>\n<td>to secrete; e.g., endocrine</td>\n</tr>\n<tr class=\"odd\">\n<td>-Ectomy</td>\n<td>surgical removal; e.g., thyroidectomy</td>\n</tr>\n<tr class=\"even\">\n<td>Enter/o -</td>\n<td>intestine, usually small intestine; e.g., enteritis</td>\n</tr>\n<tr class=\"odd\">\n<td>Gastr/o -</td>\n<td>stomach; e.g., gastritis</td>\n</tr>\n<tr class=\"even\">\n<td>Lingu/o -</td>\n<td>tongue; e.g., lingual</td>\n</tr>\n<tr class=\"odd\">\n<td>Hepat/o -</td>\n<td>liver; e.g., hepatitis</td>\n</tr>\n<tr class=\"even\">\n<td>Phag/o –</td>\n<td>to eat / engulf; e.g., phagocytosis</td>\n</tr>\n</tbody>\n</table></div>\n<h1 id=\"urinary-and-reproductive-systems\">8. Urinary and reproductive\nsystems</h1>\n<h2 id=\"combining-forms-2\">Combining forms</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Gynec/o -</td>\n<td>woman / female reproductive health; e.g., gynaecology</td>\n</tr>\n<tr class=\"even\">\n<td>Hyster/o -</td>\n<td>uterus; e.g., hysterectomy</td>\n</tr>\n<tr class=\"odd\">\n<td>Mamm/o or Mast/o -</td>\n<td>breast; e.g., mammography; mastectomy</td>\n</tr>\n<tr class=\"even\">\n<td>Ov/o -</td>\n<td>egg / ovum; e.g., ovulation</td>\n</tr>\n<tr class=\"odd\">\n<td>Ren/o -</td>\n<td>kidney; e.g., renal</td>\n</tr>\n<tr class=\"even\">\n<td>Vas/o -</td>\n<td>vessel / duct; e.g., vasectomy (vas deferens)</td>\n</tr>\n</tbody>\n</table></div>\n<h1 id=\"translate-medical-terms-into-everyday-language\">9. Translate\nmedical terms into everyday language</h1>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Term</strong></th>\n<th><strong>Definition / example</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hypertension</td>\n<td>High blood pressure</td>\n</tr>\n<tr class=\"even\">\n<td>Hypoglycaemia</td>\n<td>Low blood sugar</td>\n</tr>\n<tr class=\"odd\">\n<td>Cerebrovascular accident</td>\n<td>Stroke</td>\n</tr>\n<tr class=\"even\">\n<td>Myalgia</td>\n<td>Muscle pain</td>\n</tr>\n<tr class=\"odd\">\n<td>Pericarditis</td>\n<td>Inflammation of the sac surrounding the heart</td>\n</tr>\n<tr class=\"even\">\n<td>Vasospasm</td>\n<td>Blood vessel suddenly narrows</td>\n</tr>\n<tr class=\"odd\">\n<td>Ischaemia</td>\n<td>Not enough blood reaching a body part</td>\n</tr>\n</tbody>\n</table></div>\n<h2 id=\"worksheet-8-passage-example\">Worksheet 8 passage example</h2>\n<p>Sample technical passage — original example; not quoted from the\nassigned textbook: During skeletal muscle contraction, acetylcholine\nreleased at the neuromuscular junction depolarizes the sarcolemma and\ninitiates calcium release from the sarcoplasmic reticulum, allowing\nactin–myosin cross-bridge cycling.</p>\n<p>Plain-language rewrite: When a nerve signals a muscle, a chemical\nmessenger starts an electrical signal in the muscle. This causes calcium\nto be released inside its cells, allowing the muscle fibres to pull and\nshorten.</p>\n<h1 id=\"final-exam-checklist\">Final exam checklist</h1>\n<p>Know prefixes, roots, combining vowels and suffixes.</p>\n<p>Define anatomical directions, body planes and positions.</p>\n<p>Recognize regions on front and back of body.</p>\n<p>Demonstrate the 16 movement terms.</p>\n<p>Explain homeostasis, positive feedback and negative feedback.</p>\n<p>Translate common medical terms into everyday language.</p>\n<p>Review all system-specific terminology and test yourself without\nlooking.</p>\n";

 <div class="row"><button class="btn" onclick="fcStart('due')">Study unmastered</button><button class="btn s" onclick="fcStart('all')">Shuffle all</button></div></div>
 <p class="mu">${due} of ${CARDS.length} not yet mastered.</p>`}
function fcStart(m){const t=$('#ft').value;F.tag=t;F.mode=m;
 let d=CARDS.filter(c=>(t=='all'||c.t==t)&&(m=='all'||(P.box[c.f+c.t]||0)<4));
 if(!d.length){alert('Nothing left here. Mastered!');return}
 F.deck=shuffle(d);F.i=0;F.flip=false;fcShow()}
function fcShow(){
 if(F.i>=F.deck.length){app.innerHTML=`<h1>Round done</h1><div class="card"><p>You went through ${F.deck.length} cards.</p><button class="btn" onclick="fcMenu()">Back</button></div>`;return}
 const c=F.deck[F.i];
 app.innerHTML=`<div class="mu">${F.i+1} / ${F.deck.length}</div><div class="bar"><i style="width:${F.i/F.deck.length*100}%"></i></div>
 <div class="card fc" onclick="F.flip=!F.flip;fcShow()"><span class="tag">${c.t}</span>${F.flip?`<div class="bk">${esc(c.b)}</div>`:`<div>${esc(c.f)}</div>`}<small>${F.flip?'':'Tap to reveal'}</small></div>
 ${F.flip?`<div class="row"><button class="btn no" onclick="fcRate(0)">Missed</button><button class="btn ok" onclick="fcRate(1)">Got it</button></div>`:''}
 <p><button class="btn s" onclick="fcMenu()">End</button></p>`}
function fcRate(g){const c=F.deck[F.i],k=c.f+c.t;P.box[k]=g?Math.min(5,(P.box[k]||0)+1):0;save();
 if(!g)F.deck.push(c);F.i++;F.flip=false;fcShow()}
// ---- quiz
let Z={};
function qzMenu(){app.innerHTML=`<h1>Practice Quiz</h1><div class="card"><p>${QUIZ.length} questions from the provided quiz: multiple choice, true/false, and short answer (you grade yourself after seeing the answer).</p>
<p class="mu">Best score: ${P.best?P.best+'%':'none yet'}</p>
<div class="row"><button class="btn" onclick="qzStart(false)">Full quiz</button><button class="btn s" onclick="qzStart(true)">Quick 15</button></div>
<p class="mu">Questions you miss are saved so you can retry only those.</p>
<button class="btn s" onclick="qzStart('missed')">Retry missed (${(P.missed||[]).length})</button></div>`}
function qzStart(m){let d=QUIZ.map((x,i)=>({...x,id:i}));
 if(m==='missed')d=d.filter(x=>(P.missed||[]).includes(x.id));
 if(!d.length){alert('No missed questions yet.');return}
 d=m===true?shuffle(d).slice(0,15):m==='missed'?shuffle(d):d;
 Z={d,i:0,s:0,miss:[],ans:false,full:m===false};qzShow()}
function qzShow(){
 if(Z.i>=Z.d.length){const pct=Math.round(Z.s/Z.d.length*100);
  P.missed=m2(Z.miss);if(Z.full&&pct>P.best)P.best=pct;save();
  app.innerHTML=`<h1>Results</h1><div class="card" style="text-align:center"><div class="big">${pct}%</div><p>${Z.s} of ${Z.d.length} correct</p>
  <div class="row"><button class="btn" onclick="qzMenu()">Done</button>${Z.miss.length?`<button class="btn s" onclick="qzStart('missed')">Retry missed</button>`:''}</div></div>`;return}
 const x=Z.d[Z.i];let h=`<div class="mu">Question ${Z.i+1} / ${Z.d.length}</div><div class="bar"><i style="width:${Z.i/Z.d.length*100}%"></i></div><div class="card"><p><b>${esc(x.q)}</b></p>`;
 if(x.k=='mc')h+=x.o.map((o,j)=>`<button class="opt" onclick="qzPick(${j})">${'ABCD'[j]}. ${esc(o)}</button>`).join('');
 else if(x.k=='tf')h+=['True','False'].map(o=>`<button class="opt" onclick="qzPick('${o}')">${o}</button>`).join('');
 else h+=`<textarea id="sa" rows="3" placeholder="Type your answer (optional)" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:15px system-ui"></textarea><p><button class="btn" onclick="qzReveal()">Show answer</button></p>`;
 app.innerHTML=h+`<div id="fb"></div></div>`}
const m2=a=>[...new Set(a)];
function qzPick(v){if(Z.ans)return;Z.ans=true;const x=Z.d[Z.i];
 const ok=x.k=='mc'?v===x.a:v===x.a;
 document.querySelectorAll('.opt').forEach((b,j)=>{const val=x.k=='mc'?j:b.textContent.trim();if(val===x.a)b.classList.add('c');else if(val===v)b.classList.add('x')});
 qzFb(ok,x.k=='mc'?'ABCD'[x.a]+'. '+x.o[x.a]:x.a)}
function qzReveal(){if(Z.ans)return;Z.ans=true;const x=Z.d[Z.i];
 $('#fb').innerHTML=`<div class="ex"><b>Answer:</b> ${esc(x.a)}<br>${esc(x.e)}</div><p class="mu">Did you get it?</p><div class="row"><button class="btn no" onclick="qzNext(0)">Missed</button><button class="btn ok" onclick="qzNext(1)">Correct</button></div>`}
function qzFb(ok,a){const x=Z.d[Z.i];$('#fb').innerHTML=`<div class="ex"><b>${ok?'Correct':'Not quite'}</b>${ok?'':' — answer: '+esc(a)}<br>${esc(x.e)}</div><p><button class="btn" onclick="qzNext(${ok?1:0})">Next</button></p>`}
function qzNext(ok){const x=Z.d[Z.i];if(ok)Z.s++;else Z.miss.push(x.id);
 if(!Z.full&&ok&&P.missed)P.missed=P.missed.filter(i=>i!==x.id);
 Z.i++;Z.ans=false;qzShow()}
// ---- guide
function guide(){app.innerHTML=`<h1>Study Guide</h1><input id="gs" placeholder="Search guide…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:15px system-ui;margin-bottom:8px"><div id="gb">${GUIDE}</div>`;
 $('#gs').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#gb tr').forEach(r=>r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none');
  document.querySelectorAll('#gb p,#gb li').forEach(r=>r.style.display=!q||r.textContent.toLowerCase().includes(q)?'':'none')}}
// ---- stats
function stats(){const by={};CARDS.forEach(c=>{const b=by[c.t]=by[c.t]||{n:0,m:0};b.n++;if((P.box[c.f+c.t]||0)>=4)b.m++});
 const tm=Object.values(by).reduce((a,b)=>a+b.m,0);
 app.innerHTML=`<h1>Progress</h1><div class="card"><div class="big">${Math.round(tm/CARDS.length*100)}%</div><div class="mu">${tm} of ${CARDS.length} cards mastered • Best quiz ${P.best?P.best+'%':'—'}</div></div>
 <div class="card">${Object.entries(by).map(([t,b])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${t}</span><span class="mu">${b.m}/${b.n}</span></div><div class="bar"><i style="width:${b.m/b.n*100}%"></i></div></div>`).join('')}</div>
 <button class="btn s" onclick="if(confirm('Reset all progress?')){P={box:{},best:0};save();stats()}">Reset progress</button>`}
go('cards');
</script></body></html>
